@if (isBrowser()) {
  <ko-stage [config]="configStage">
    <ko-layer>
      @if (gridImage()) {
        <ko-image
          [config]="{ image: gridImage(), x: 0, y: 0, width: configStage.width, height: configStage.height }"
        ></ko-image>
      }
    </ko-layer>
    <ko-layer>
      @if (circleImage()) {
        <ko-image
          [config]="{ image: circleImage(), x: 50, y: 50, width: 300, height: 300 }"
        ></ko-image>
      }
    </ko-layer>
  </ko-stage>
}
